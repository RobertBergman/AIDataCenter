    - { prefix: "10.20.0.0/24", vlan: oob, status: active, description: "OOB BMC", role: oob }
    - { prefix: "10.30.0.0/16", vlan: fabric-underlay, status: container, description: "Fabric underlay container", role: fabric }
    - { prefix: "10.40.0.0/16", vlan: storage, status: active, description: "Storage data", role: storage }
    - { prefix: "10.96.0.0/12", status: container, description: "Kubernetes services (documented)", role: k8s-service }
    - { prefix: "10.244.0.0/16", status: container, description: "Kubernetes pods (documented)", role: k8s-pod }

# VLANs (L2 tags — fabric underlay may use different VRFs on EOS)
vlans:
  - { vid: 10, name: mgmt, slug: mgmt, description: "Kubernetes/OS management" }
  - { vid: 20, name: oob, slug: oob, description: "BMC / switch Management1 via 7010TX-48" }
  - { vid: 100, name: fabric-underlay, slug: fabric-underlay, description: "RoCE rail underlay (informational)" }
  - { vid: 50, name: edge-access, slug: edge-access, description: "Edge/API access (VRF edge, L2VNI 10050) — worker tagged subif on rail0/7 NICs" }
  - { vid: 200, name: storage, slug: storage, description: "Storage access (VRF storage, L2VNI 10200) — worker tagged subif on rail0/7 NICs" }

# IPAM prefixes
ipam:
  aggregates:
    - { prefix: "10.0.0.0/8", rir: RFC1918, description: "Private RFCs for cluster" }
  prefixes:
    - { prefix: "10.10.0.0/24", vlan: mgmt, status: active, description: "Mgmt / bootstrap", role: management }
    - { prefix: "10.20.0.0/24", vlan: oob, status: active, description: "OOB BMC", role: oob }
    - { prefix: "10.30.0.0/16", vlan: fabric-underlay, status: container, description: "Fabric underlay container", role: fabric }
    - { prefix: "10.30.0.0/24", status: active, description: "Fabric loopbacks /32 (BGP router-ids): spines .1-.2, leaves .11-.18", role: fabric }
    - { prefix: "10.30.0.0/19", status: container, description: "Leaf-spine p2p /31 pool: leaf-rail{i} uses 10.30.{2i+1}.0/29 (spine1) + 10.30.{2i+2}.0/29 (spine2)", role: fabric }
    - { prefix: "10.30.64.0/19", status: container, description: "Host rail subnets: rail{i} = 10.30.{64+i}.0/24 (leaf .1, worker0N .1N)", role: fabric }
    - { prefix: "10.30.32.0/24", status: active, description: "VTEP loopbacks (Loopback1): spines .1-.2, leaves .11-.18 (EVPN/VXLAN, docs/overlay.md)", role: fabric }
    - { prefix: "10.40.0.0/16", status: container, description: "Storage data (VRF storage, L3VNI 50200)", role: storage }
    - { prefix: "10.40.0.0/24", status: active, description: "Storage p2p /31 (vrf storage): leaf-rail0 Eth25-28 .0-.7, leaf-rail7 Eth25-28 .8-.15", role: storage }
    - { prefix: "10.40.64.0/24", vlan: storage, status: active, description: "Storage access VLAN 200: VARP gw .1, leaf-rail{i} .{2+i}, worker0N .1N (tagged subif)", role: storage }
    - { prefix: "10.50.0.0/16", status: container, description: "Edge / API services (VRF edge, L3VNI 50050)", role: edge }
    - { prefix: "10.50.0.0/24", status: active, description: "LoadBalancer VIP pool (MetalLB BGP): inference gateway .10", role: edge }
    - { prefix: "10.50.64.0/24", vlan: edge-access, status: active, description: "Edge access VLAN 50: VARP gw .1, leaf-rail{i} .{2+i}, worker0N .1N (tagged subif); MetalLB peers leaf .2/.9", role: edge }
    - { prefix: "10.50.255.0/29", status: active, description: "Border p2p /31 (vrf edge): spine1 Eth33 .0/31, spine2 Eth33 .2/31 → campus firewall AS 65500", role: edge }
    - { prefix: "10.96.0.0/12", status: container, description: "Kubernetes services (documented)", role: k8s-service }
    - { prefix: "10.244.0.0/16", status: container, description: "Kubernetes pods (documented)", role: k8s-pod }
  # Reserved / assigned IPs (expanded devices also allocate primary+bmc)
  ip_addresses:
    - { address: "10.10.0.1/24", dns_name: "gw-mgmt.ai.local", description: "Mgmt gateway", role: anycast }
    - { address: "10.20.0.1/24", dns_name: "gw-oob.ai.local", description: "OOB gateway", role: anycast }
    - { address: "10.10.0.10/24", dns_name: "seed01.ai.local", description: "seed01 primary", device: seed01, interface: mgmt0 }
    - { address: "10.10.0.20/24", dns_name: "api.ai.local", description: "K8s API VIP", role: vip }
    - { address: "10.10.0.31/24", dns_name: "registry.ai.local", description: "Harbor VIP/primary", role: vip }
    - { address: "10.40.64.1/24", dns_name: "gw-storage.ai.local", description: "Storage access VARP gateway (VRF storage)", role: anycast }
    - { address: "10.50.64.1/24", dns_name: "gw-edge.ai.local", description: "Edge access VARP gateway (VRF edge)", role: anycast }
    - { address: "10.50.0.10/24", dns_name: "inference.ai.local", description: "Inference API gateway VIP (Envoy, MetalLB)", role: vip }
    # Switch management (VLAN 20) — ZTP reservations keyed by Management1 MAC
    - { address: "10.20.0.11/24", dns_name: "oob-sw1.ai.local", description: "oob-sw1 SVI20 (VARP real)", device: oob-sw1, interface: Management1 }
    - { address: "10.20.0.12/24", dns_name: "oob-sw2.ai.local", description: "oob-sw2 SVI20 (VARP real)", device: oob-sw2, interface: Management1 }
    - { address: "10.20.0.13/24", dns_name: "spine1.ai.local", description: "spine1 Management1 (ZTP)", device: spine1, interface: Management1 }
    - { address: "10.20.0.14/24", dns_name: "spine2.ai.local", description: "spine2 Management1 (ZTP)", device: spine2, interface: Management1 }
    - { address: "10.20.0.41/24", dns_name: "leaf-rail0.ai.local", description: "leaf-rail0 Management1 (ZTP)", device: leaf-rail0, interface: Management1 }
    - { address: "10.20.0.42/24", dns_name: "leaf-rail1.ai.local", description: "leaf-rail1 Management1 (ZTP)", device: leaf-rail1, interface: Management1 }
    - { address: "10.20.0.43/24", dns_name: "leaf-rail2.ai.local", description: "leaf-rail2 Management1 (ZTP)", device: leaf-rail2, interface: Management1 }

# Cabling tables — formulas applied by import_seed.py
cabling_policy:
  fabric:
    # worker[N].rail{i} <-> leaf-rail{i}.Ethernet{N}  (N=1..8 maps worker01..08)
    host_port_template: "rail{rail}"
    leaf_port_template: "Ethernet{worker_index}"  # 1-based
    media: dac-qsfpdd-400g
    length_m: 3
    color: "009688"
    label_template: "R{rail}-W{worker:02d}"
  leaf_spine:
    # leaf-rail{i}.Ethernet{17+j} <-> spine{(j%2)+1}.Ethernet{i*4 + j + 1}
    # 8 uplinks per leaf: 4 to each spine
    uplinks_per_leaf: 8
    media: aoc-qsfpdd-400g
    length_m: 15
    color: "ff9800"
    label_template: "L{rail}S{spine}-U{uplink}"
  oob:
    # BMC of devices in rack → nearest oob switch
    media: cat6
    length_m: 5
    color: "795548"
    label_template: "OOB-{device}"
  mgmt:
    # Optional: mgmt0 to access switch — if not used, mgmt may be on fabric VRF
    enabled: false

cable_types:
  - { name: "DAC 400G QSFP-DD 3m", slug: dac-qsfpdd-400g, length: 3, length_unit: m }
  - { name: "AOC 400G QSFP-DD 15m", slug: aoc-qsfpdd-400g, length: 15, length_unit: m }
  - { name: "Cat6 5m", slug: cat6, length: 5, length_unit: m }

# Export mapping for bootstrap inventory
export:
  control_plane_role: control-plane
  gpu_worker_role: gpu-worker
  utility_role: utility
  bootstrap_role: bootstrap
  mgmt_interface: mgmt0
  bmc_interface: bmc
  mgmt_prefix: "10.10.0.0/24"
  oob_prefix: "10.20.0.0/24"
  gateway_mgmt: "10.10.0.1"
  gateway_oob: "10.20.0.1"
  dns: ["10.10.0.10"]
  ntp: ["10.10.0.10"]
  k8s_version: v1.32.2

# Declarative design intent for NetBox import (source of truth in git until live).
# import_seed.py expands device interfaces, IPs, and full rail cabling matrices.
#
# After go-live: NetBox is authoritative; re-export from NetBox, do not hand-edit exports.
# To change design: edit this file → import (or mutate NetBox UI) → export.


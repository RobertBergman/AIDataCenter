apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: ai-cluster
  namespace: metal3
  labels:
    cluster.x-k8s.io/cluster-name: ai-cluster
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 10.244.0.0/16
    services:
      cidrBlocks:
        - 10.96.0.0/12
    serviceDomain: cluster.local
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: ai-cluster-cp
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: Metal3Cluster
    name: ai-cluster
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: Metal3Cluster
metadata:
  name: ai-cluster
  namespace: metal3
spec:
  controlPlaneEndpoint:
    host: 10.10.0.20
    port: 6443
  noCloudProvider: true

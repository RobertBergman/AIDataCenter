# BareMetalHost inventory for Metal3.
# Replace MAC/BMC placeholders with factory stickers; secrets via BMC_USERNAME/PASSWORD.
# Apply after metal3/CAPM3 controllers are healthy.
---
apiVersion: v1
kind: Secret
metadata:
  name: bmc-credentials-template
  namespace: metal3
  labels:
    # real nodes use individual secrets generated by scripts/render-bmh.sh
    cluster.x-k8s.io/cluster-name: ai-cluster
type: Opaque
stringData:
  username: CHANGE_ME
  password: CHANGE_ME
---
# Example BareMetalHost — scripts/render-bmh.sh expands all from inventory
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: cp01
  namespace: metal3
  labels:
    cluster.x-k8s.io/cluster-name: ai-cluster
    role: control-plane
    topology.kubernetes.io/rack: BOOT
  annotations:
    baremetalhost.metal3.io/detached: "false"
spec:
  online: true
  bmc:
    address: redfish-virtualmedia://10.20.0.21/redfish/v1/Systems/1
    credentialsName: bmc-cp01
    disableCertificateVerification: true
  bootMACAddress: "00:00:00:00:00:21"
  bootMode: UEFI
  rootDeviceHints:
    deviceName: /dev/nvme0n1
  automatedCleaningMode: metadata
---
apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: worker01
  namespace: metal3
  labels:
    cluster.x-k8s.io/cluster-name: ai-cluster
    role: gpu-worker
    topology.kubernetes.io/rack: GPU-1
    nvidia.com/gpu.count: "8"
spec:
  online: true
  bmc:
    address: redfish-virtualmedia://10.20.0.101/redfish/v1/Systems/1
    credentialsName: bmc-worker01
    disableCertificateVerification: true
  bootMACAddress: "00:00:00:00:01:01"
  bootMode: UEFI
  rootDeviceHints:
    deviceName: /dev/nvme0n1
  automatedCleaningMode: metadata
  # Consumer binding happens when CAPI claims the host

apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineDeployment
metadata:
  name: ai-cluster-gpu
  namespace: metal3
  labels:
    cluster.x-k8s.io/cluster-name: ai-cluster
    node-role.kubernetes.io/gpu-worker: ""
spec:
  clusterName: ai-cluster
  replicas: 8
  selector:
    matchLabels:
      cluster.x-k8s.io/cluster-name: ai-cluster
      node-role.kubernetes.io/gpu-worker: ""
  template:
    metadata:
      labels:
        cluster.x-k8s.io/cluster-name: ai-cluster
        node-role.kubernetes.io/gpu-worker: ""
    spec:
      clusterName: ai-cluster
      version: v1.32.2
      bootstrap:
        configRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
          kind: KubeadmConfigTemplate
          name: ai-cluster-gpu
      infrastructureRef:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: Metal3MachineTemplate
        name: ai-cluster-gpu
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: ai-cluster-gpu
  namespace: metal3
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          criSocket: unix:///var/run/containerd/containerd.sock
          kubeletExtraArgs:
            node-labels: >-
              node.kubernetes.io/role=gpu-worker,
              nvidia.com/gpu.present=true,
              feature.node.kubernetes.io/pci-10de.present=true
            # Allow large shared-memory for vLLM / TRT-LLM
            allowed-unsafe-sysctls: "net.core.somaxconn,kernel.shm*"
          taints:
            - effect: NoSchedule
              key: nvidia.com/gpu
              value: "true"
      preKubeadmCommands:
        - systemctl daemon-reload
        - systemctl restart containerd
        - modprobe br_netfilter || true
        - sysctl -w net.ipv4.ip_forward=1
        # Host prep for RDMA/RoCE (full NIC config post-boot via Network Operator)
        - modprobe ib_uverbs || true
        - modprobe rdma_ucm || true
      files:
        - path: /etc/modules-load.d/ai-rdma.conf
          owner: root:root
          permissions: "0644"
          content: |
            ib_uverbs
            rdma_ucm
            mlx5_core
            mlx5_ib
        - path: /etc/sysctl.d/99-ai-network.conf
          owner: root:root
          permissions: "0644"
          content: |
            net.core.rmem_max = 2147483647
            net.core.wmem_max = 2147483647
            net.ipv4.tcp_rmem = 4096 87380 2147483647
            net.ipv4.tcp_wmem = 4096 65536 2147483647
            net.core.netdev_max_backlog = 250000
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: Metal3MachineTemplate
metadata:
  name: ai-cluster-gpu
  namespace: metal3
spec:
  template:
    spec:
      dataTemplate:
        name: ai-cluster-gpu-metadata
      image:
        checksum: ""
        checksumType: sha256
        format: qcow2
        url: http://10.10.0.10:8080/images/ubuntu-24.04-server-cloudimg-amd64.img
      automatedCleaningMode: metadata
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: Metal3DataTemplate
metadata:
  name: ai-cluster-gpu-metadata
  namespace: metal3
spec:
  clusterName: ai-cluster
  metaData:
    objectNames:
      - key: name
        object: machine
      - key: local-hostname
        object: machine
  networkData:
    links:
      ethernets:
        - type: phy
          idFromMACAnnotation: metal3.io/mac-address
          mtu: 1500
    networks:
      ipv4:
        - id: mgmt
          ipAddressFromIPPool: mgmt-pool
          link: eth0
          routes:
            - to: 0.0.0.0
              prefix: 0
              gateway:
                fromIPPool: mgmt-pool
    services:
      dns:
        - 10.10.0.10

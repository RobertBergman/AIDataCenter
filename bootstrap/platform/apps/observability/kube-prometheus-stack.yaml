apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: observability
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 70.4.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    grafana:
      enabled: true
      adminPassword: ChangeMeOnFirstBoot
      persistence:
        enabled: true
        size: 20Gi
        storageClassName: local-path
      additionalDataSources:
        - name: Loki
          type: loki
          url: http://loki-gateway.observability.svc:80
          access: proxy
    prometheus:
      prometheusSpec:
        retention: 30d
        scrapeInterval: 15s
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 200Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        additionalScrapeConfigs:
          - job_name: dcgm
            kubernetes_sd_configs:
              - role: endpoints
                namespaces:
                  names: [gpu-operator]
            relabel_configs:
              - source_labels: [__meta_kubernetes_service_label_app]
                regex: nvidia-dcgm-exporter
                action: keep
    alertmanager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
    kubeEtcd:
      enabled: true
    defaultRules:
      create: true
      rules:
        etcd: true
        general: true
        k8s: true
        kubeApiserverAvailability: true
        kubePrometheusNodeAlerting: true
        kubernetesApps: true
        node: true

# Hugging Face token for model pulls (Vault → K8s Secret via ESO).
# Seed the value once: vault kv put secret/inference/huggingface token=hf_xxx
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hf-credentials
  namespace: inference
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: hf-credentials
  data:
    - secretKey: HF_TOKEN
      remoteRef:
        key: secret/inference/huggingface
        property: token

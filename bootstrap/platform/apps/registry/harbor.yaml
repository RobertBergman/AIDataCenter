apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: goharbor
  namespace: harbor
spec:
  interval: 1h
  url: https://helm.goharbor.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
  namespace: harbor
spec:
  interval: 30m
  chart:
    spec:
      chart: harbor
      version: 1.16.2
      sourceRef:
        kind: HelmRepository
        name: goharbor
  values:
    expose:
      type: clusterIP
      tls:
        enabled: true
        certSource: secret
        secret:
          secretName: harbor-tls
    externalURL: https://registry.ai.local
    persistence:
      enabled: true
      resourcePolicy: keep
      persistentVolumeClaim:
        registry:
          size: 500Gi
          storageClass: local-path
        jobservice:
          jobLog:
            size: 5Gi
        database:
          size: 20Gi
        redis:
          size: 5Gi
        trivy:
          size: 20Gi
    harborAdminPassword: "ChangeMeOnFirstBoot"
    portal:
      replicas: 2
    core:
      replicas: 2
    registry:
      replicas: 2
    trivy:
      enabled: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

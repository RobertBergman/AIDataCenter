# Envoy Gateway — the inference API front door (SPEC §8: API Gateway).
#
# Terminates TLS on VIP 10.50.0.10 (inference.ai.local), enforces API-key
# auth + per-key rate limits (auth.yaml), streams every request/response to
# the archive tap (archive.yaml), and routes /v1 to the inference scheduler
# (inference-scheduler.yaml).
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 1h
  url: oci://docker.io/envoyproxy/gateway-helm
  ref:
    tag: v1.4.2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 30m
  chart:
    spec:
      chart: gateway-helm
      version: v1.4.2
      sourceRef:
        kind: OCIRepository
        name: envoy-gateway
  values:
    config:
      envoyGateway:
        rateLimit:
          backend:
            type: Redis
            redis:
              url: ratelimit-redis.envoy-gateway-system.svc:6379
---
# Backing store for the global rate-limit service (per-key quotas)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratelimit-redis
  namespace: envoy-gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ratelimit-redis
  template:
    metadata:
      labels:
        app: ratelimit-redis
    spec:
      containers:
        - name: redis
          image: registry.ai.local/library/redis:7.4-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 100m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ratelimit-redis
  namespace: envoy-gateway-system
spec:
  selector:
    app: ratelimit-redis
  ports:
    - port: 6379
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: inference-proxy-config
    namespace: envoy-gateway-system
---
# Proxy fleet config: pin the LB VIP + mirror all traffic to the archive tap
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: inference-proxy-config
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        loadBalancerIP: 10.50.0.10   # inference.ai.local (NetBox-allocated)
      envoyDeployment:
        replicas: 2
  telemetry:
    accessLog:
      settings:
        - format:
            type: JSON
            json:
              request_id: "%REQ(X-REQUEST-ID)%"
              api_key_id: "%REQ(X-API-KEY-ID)%"
              path: "%REQ(:PATH)%"
              status: "%RESPONSE_CODE%"
              duration_ms: "%DURATION%"
              bytes_rx: "%BYTES_RECEIVED%"
              bytes_tx: "%BYTES_SENT%"
              model: "%REQ(X-SELECTED-MODEL)%"
          sinks:
            - type: ALS
              als:
                backendRefs:
                  - name: archive-tap
                    namespace: inference
                    port: 9000
                type: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: inference-gw
  namespace: inference
spec:
  gatewayClassName: envoy
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: inference.ai.local
      tls:
        mode: Terminate
        certificateRefs:
          - name: inference-ai-local-tls
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: inference-ai-local
  namespace: inference
spec:
  secretName: inference-ai-local-tls
  dnsNames:
    - inference.ai.local
  issuerRef:
    kind: ClusterIssuer
    name: internal-ca

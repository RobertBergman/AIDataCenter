apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kuberay
  namespace: inference
spec:
  interval: 1h
  url: https://ray-project.github.io/kuberay-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kuberay-operator
  namespace: inference
spec:
  interval: 30m
  chart:
    spec:
      chart: kuberay-operator
      version: 1.3.0
      sourceRef:
        kind: HelmRepository
        name: kuberay
  values:
    batchScheduler:
      enabled: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ray-cluster-example
  namespace: inference
data:
  research-ray.yaml: |
    apiVersion: ray.io/v1
    kind: RayCluster
    metadata:
      name: research
      namespace: inference
    spec:
      rayVersion: "2.43.0"
      headGroupSpec:
        rayStartParams:
          dashboard-host: "0.0.0.0"
        template:
          spec:
            containers:
              - name: ray-head
                image: registry.ai.local/library/ray:2.43.0-py311
                resources:
                  requests:
                    cpu: "4"
                    memory: 16Gi
      workerGroupSpecs:
        - groupName: gpu-workers
          replicas: 0
          minReplicas: 0
          maxReplicas: 8
          rayStartParams: {}
          template:
            spec:
              tolerations:
                - key: nvidia.com/gpu
                  operator: Exists
                  effect: NoSchedule
              containers:
                - name: ray-worker
                  image: registry.ai.local/library/ray:2.43.0-py311-gpu
                  resources:
                    limits:
                      nvidia.com/gpu: "8"

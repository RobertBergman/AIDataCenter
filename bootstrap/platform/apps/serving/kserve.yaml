apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kserve
  namespace: kserve
spec:
  interval: 1h
  url: oci://ghcr.io/kserve/charts
  ref:
    tag: v0.14.1
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-crd
  namespace: kserve
spec:
  interval: 30m
  chart:
    spec:
      chart: kserve-crd
      version: v0.14.1
      sourceRef:
        kind: OCIRepository
        name: kserve
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve
  namespace: kserve
spec:
  interval: 30m
  dependsOn:
    - name: kserve-crd
  chart:
    spec:
      chart: kserve
      version: v0.14.1
      sourceRef:
        kind: OCIRepository
        name: kserve
  values:
    kserve:
      controller:
        deploymentMode: RawDeployment
      modelmesh:
        enabled: false
      version: v0.14.1
---
# Example InferenceService skeleton (disable until weights exist)
apiVersion: v1
kind: ConfigMap
metadata:
  name: inferenceservice-examples
  namespace: inference
data:
  moe-example.yaml: |
    apiVersion: serving.kserve.io/v1beta1
    kind: InferenceService
    metadata:
      name: moe-3t
      namespace: inference
    spec:
      predictor:
        nodeSelector:
          nvidia.com/gpu.present: "true"
        tolerations:
          - key: nvidia.com/gpu
            operator: Exists
            effect: NoSchedule
        containers:
          - name: kserve-container
            image: registry.ai.local/library/vllm-openai:latest
            args:
              - --model=/models/moe-3t/current
              - --tensor-parallel-size=8
              - --pipeline-parallel-size=1
            env:
              - name: NCCL_IB_DISABLE
                value: "0"
            resources:
              limits:
                nvidia.com/gpu: "8"
              requests:
                nvidia.com/gpu: "8"
            volumeMounts:
              - name: models
                mountPath: /models
                readOnly: true
        volumes:
          - name: models
            persistentVolumeClaim:
              claimName: models-rwx

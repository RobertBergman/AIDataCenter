apiVersion: v1
kind: Namespace
metadata:
  name: netbox
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: netbox
  namespace: netbox
spec:
  interval: 1h
  url: https://charts.netbox.dev
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
  namespace: netbox
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: netbox
      sourceRef:
        kind: HelmRepository
        name: netbox
      interval: 1h
  values:
    replicaCount: 2
    image:
      tag: v4.2.6
    superuser:
      name: admin
      email: netbox@ai.local
      password: ChangeMeOnFirstBoot
    secretKey: ChangeMeGenerateLongRandomSecretKeyForNetbox
    allowedHosts: "netbox.ai.local,netbox.netbox.svc,localhost"
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: netbox.ai.local
          paths:
            - path: /
              pathType: Prefix
    postgresql:
      enabled: true
      auth:
        username: netbox
        database: netbox
        password: ChangeMePostgres
      primary:
        persistence:
          size: 50Gi
          storageClass: local-path
    redis:
      enabled: true
      auth:
        password: ChangeMeRedis
      master:
        persistence:
          size: 8Gi
          storageClass: local-path
    persistence:
      enabled: true
      size: 20Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 4Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

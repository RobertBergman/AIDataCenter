apiVersion: v1
kind: Namespace
metadata:
  name: netbox
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: netbox
  namespace: netbox
spec:
  interval: 1h
  url: https://charts.netbox.dev
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbox
  namespace: netbox
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: netbox
      # Chart 8.x tracks NetBox 4.6.x (appVersion v4.6.5 as of chart 8.3.37).
      version: ">=8.3.0 <9.0.0"
      sourceRef:
        kind: HelmRepository
        name: netbox
      interval: 1h
  values:
    replicaCount: 2
    image:
      tag: v4.6.5
    # NetBox 4.5+ v2 API tokens need HMAC peppers; the chart auto-generates
    # and preserves one (values: apiTokenPeppers) — leave empty for day-2.
    # Housekeeping runs as a built-in system job since NetBox 4.4; the
    # chart's legacy CronJob (deprecated manage.py housekeeping) is redundant.
    housekeeping:
      enabled: false
    superuser:
      name: admin
      email: netbox@ai.local
      password: ChangeMeOnFirstBoot
    secretKey: ChangeMeGenerateLongRandomSecretKeyForNetbox
    allowedHosts: "netbox.ai.local,netbox.netbox.svc,localhost"
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: netbox.ai.local
          paths:
            - path: /
              pathType: Prefix
    postgresql:
      enabled: true
      auth:
        username: netbox
        database: netbox
        password: ChangeMePostgres
      primary:
        persistence:
          size: 50Gi
          storageClass: local-path
    redis:
      enabled: true
      auth:
        password: ChangeMeRedis
      master:
        persistence:
          size: 8Gi
          storageClass: local-path
    persistence:
      enabled: true
      size: 20Gi
      storageClass: local-path
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 4Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

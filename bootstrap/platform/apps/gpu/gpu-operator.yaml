apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nvidia
  namespace: gpu-operator
spec:
  interval: 1h
  url: https://helm.ngc.nvidia.com/nvidia
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  interval: 30m
  timeout: 30m
  chart:
    spec:
      chart: gpu-operator
      version: v25.3.0
      sourceRef:
        kind: HelmRepository
        name: nvidia
  values:
    operator:
      defaultRuntime: containerd
    driver:
      enabled: true
      # B200 / NVIDIA open kernel module path — pin after vendor certify
      version: ""
    toolkit:
      enabled: true
    devicePlugin:
      enabled: true
      config:
        name: device-plugin-config
        create: true
        default: any
        data:
          any: |-
            version: v1
            flags:
              migStrategy: none
            sharing:
              timeSlicing: {}
    dcgm:
      enabled: true
    dcgmExporter:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 15s
    gfd:
      enabled: true
    migManager:
      enabled: false
    nodeStatusExporter:
      enabled: true
    validator:
      plugin:
        env:
          - name: WITH_WORKLOAD
            value: "true"
    # Prefer GPU workers only
    daemonsets:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        nvidia.com/gpu.present: "true"
    # NCCL / GPUDirect diagnostics optional
    gdrcopy:
      enabled: true

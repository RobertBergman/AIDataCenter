# Ordered Flux Kustomizations — dependsOn enforces bootstrap stack order
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-core
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: ai-cluster
  path: ./bootstrap/platform/apps/core
  prune: true
  wait: true
  timeout: 10m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-security
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: platform-core
  sourceRef:
    kind: GitRepository
    name: ai-cluster
  path: ./bootstrap/platform/apps/security
  prune: true
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-netbox
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: platform-core
    - name: platform-security
  sourceRef:
    kind: GitRepository
    name: ai-cluster
  path: ./bootstrap/platform/apps/netbox
  prune: true
  wait: true
  timeout: 20m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-registry
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: platform-core
  sourceRef:
    kind: GitRepository
    name: ai-cluster
  path: ./bootstrap/platform/apps/registry
  prune: true
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-observability
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: platform-core
  sourceRef:
    kind: GitRepository
    name: ai-cluster
  path: ./bootstrap/platform/apps/observability
  prune: true
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-bus
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: platform-core
  sourceRef:
    kind: GitRepository
    name: ai-cluster
  path: ./bootstrap/platform/apps/bus
  prune: true
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-gpu
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: platform-registry
    - name: platform-observability
  sourceRef:
    kind: GitRepository
    name: ai-cluster
  path: ./bootstrap/platform/apps/gpu
  prune: true
  wait: true
  timeout: 30m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-serving
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: platform-gpu
  sourceRef:
    kind: GitRepository
    name: ai-cluster
  path: ./bootstrap/platform/apps/serving
  prune: true
  wait: true
  timeout: 20m

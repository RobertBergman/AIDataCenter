# The seed's HTTP service: one endpoint for artifacts and the ZTP API.
#
# Booting devices only ever need to know one URL (the one DHCP option 67 hands them),
# so both the static golden configs and the dynamic ZTP service live behind :8080.

events { worker_connections 256; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    log_format ztp '$remote_addr [$time_local] "$request" $status $body_bytes_sent';
    access_log /dev/stdout ztp;
    error_log  /dev/stderr warn;

    # The ZTP API shares this container's network namespace (see docker-compose.seed.yml),
    # so it is reachable on loopback rather than by service name.
    upstream ztp_api { server 127.0.0.1:9095; }

    server {
        listen 8080;
        server_name seed;

        # Rendered golden configs. Read-only: a device can fetch its config, never write it.
        location /artifacts/ {
            alias /artifacts/;
            autoindex on;
            add_header Cache-Control "no-store";
        }

        # NOS and OS images a bare-metal node would pull after iPXE chainload.
        location /images/ {
            alias /images/;
            autoindex on;
        }

        location /ztp/    { proxy_pass http://ztp_api/ztp/;
                            proxy_set_header X-Real-IP $remote_addr;
                            proxy_set_header X-Device-MAC $http_x_device_mac; }
        location /metrics { proxy_pass http://ztp_api/metrics; }

        location = / {
            default_type text/plain;
            return 200 "AI datacenter seed node\n\n  /ztp/ztp.json    ZTP descriptor (DHCP option 67 target)\n  /ztp/inventory   provisioning state\n  /artifacts/      rendered golden configs\n  /images/         NOS + OS images\n  /metrics         prometheus\n";
        }
    }
}

# The seed / bootstrap node.
#
# In the reference architecture this is a single 1U x86 server -- the only machine in the
# building that is installed by hand. Everything it serves (DHCP, DNS, NTP, TFTP/iPXE,
# HTTP artifacts, the ZTP API, syslog, metrics) therefore lives at ONE address.
#
# `network_mode: service:seed` gives every service the seed's network namespace, so the
# stack really does present as one host on 10.10.0.10 rather than a handful of unrelated
# containers that happen to be nearby.

name: aidc-lab

networks:
  oob:
    name: aidc-oob
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1
          # Docker's own IPAM is confined here so it can never hand out an address that
          # collides with a DHCP reservation (.21-.44) or the dynamic pool (.200-.250).
          # Devices flush this address at boot and take a real DHCP lease instead.
          ip_range: 10.10.0.64/26

services:
  # Owns the seed's network identity. Every other seed service shares this namespace.
  seed:
    image: alpine:3.20
    container_name: seed
    hostname: seed
    command: ["sleep", "infinity"]
    networks:
      oob:
        ipv4_address: 10.10.0.10
        mac_address: 02:aa:00:00:00:fe
    ports:
      # Host-side ports avoid Windows' reserved ranges (see `netsh interface ipv4
      # show excludedportrange protocol=tcp`); 3000 in particular is usually taken.
      - "8080:8080"    # artifacts + ZTP API
      - "13000:3000"   # grafana
      - "19090:9090"   # prometheus
    restart: unless-stopped

  # ---- PROVISIONING -------------------------------------------------------
  seed-dnsmasq:
    image: dockurr/dnsmasq:2.90
    container_name: seed-dnsmasq
    depends_on: [seed]
    network_mode: "service:seed"
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE]
    volumes:
      - ./seed/generated/dnsmasq.conf:/etc/dnsmasq.conf:ro
      - ./seed/generated/hosts:/etc/dnsmasq/hosts:ro
      - ./seed/tftpboot:/tftpboot:ro
    command: ["--conf-file=/etc/dnsmasq.conf", "--keep-in-foreground", "--log-facility=-"]
    restart: unless-stopped

  seed-http:
    image: nginx:1.27-alpine
    container_name: seed-http
    depends_on: [seed, seed-ztp]
    network_mode: "service:seed"
    volumes:
      - ./seed/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./out/artifacts:/artifacts:ro
      - ./seed/images:/images:ro
    restart: unless-stopped

  seed-ztp:
    build: ./seed/ztp-api
    image: aidc-ztp-api:latest
    container_name: seed-ztp
    depends_on: [seed]
    network_mode: "service:seed"
    environment:
      ARTIFACT_DIR: /artifacts
      STATE_FILE: /state/registrations.json
      SEED_URL: http://10.10.0.10:8080
    volumes:
      - ./out/artifacts:/artifacts:ro
      - ./out/seed-state:/state
    restart: unless-stopped

  # ---- OBSERVABILITY ------------------------------------------------------
  seed-syslog:
    build: ./seed/syslog
    image: aidc-syslog:latest
    container_name: seed-syslog
    depends_on: [seed]
    network_mode: "service:seed"
    volumes:
      - ./out/seed-state:/state
    restart: unless-stopped

  seed-prometheus:
    image: prom/prometheus:v2.54.1
    container_name: seed-prometheus
    depends_on: [seed]
    network_mode: "service:seed"
    volumes:
      - ./seed/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
    restart: unless-stopped

  seed-grafana:
    image: grafana/grafana:11.2.0
    container_name: seed-grafana
    depends_on: [seed, seed-prometheus]
    network_mode: "service:seed"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./seed/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./seed/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prom-data:
  grafana-data:

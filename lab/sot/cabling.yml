    type: rail
    rail: 3
    a: { device: gpu01, port: rail3,      ifindex: 4 }
    b: { device: leaf4, port: Ethernet0,  ifindex: 1 }
  - id: gpu02-rail3
    type: rail
    rail: 3
    a: { device: gpu02, port: rail3,      ifindex: 4 }
    b: { device: leaf4, port: Ethernet4,  ifindex: 2 }
  - id: gpu03-rail3

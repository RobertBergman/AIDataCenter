# Source of Truth: the cable plan (a.k.a. the rail map)
#
# THIS IS THE FILE THAT MATTERS. In a rail-optimised fabric the NIC-to-leaf mapping is a
# correctness constraint, not a convenience: NIC k of every GPU node must land on leaf k.
# One NIC cabled into the wrong rail silently forces cross-rail traffic through the spines
# and degrades every collective on that node.
#
# The verification suite walks LLDP on every device and diffs the discovered neighbours
# against this file. `scripts/inject-miscable.ps1` deliberately swaps two rails to prove
# the check actually fires.
#
# ifindex = the Nth container interface. On sonic-vs, container interface N is bound to
# front-panel port Ethernet(4*(N-1)) -- see README "How sonic-vs maps interfaces".

links:

  # ===== leaf uplinks to spine (underlay /31s) ==============================
  - id: leaf1-spine1
    type: fabric
    a: { device: leaf1,  port: Ethernet16, ifindex: 5, ip: 10.1.1.0/31 }
    b: { device: spine1, port: Ethernet0,  ifindex: 1, ip: 10.1.1.1/31 }
  - id: leaf1-spine2
    type: fabric
    a: { device: leaf1,  port: Ethernet20, ifindex: 6, ip: 10.1.1.2/31 }
    b: { device: spine2, port: Ethernet0,  ifindex: 1, ip: 10.1.1.3/31 }

  - id: leaf2-spine1
    type: fabric
    a: { device: leaf2,  port: Ethernet16, ifindex: 5, ip: 10.1.2.0/31 }
    b: { device: spine1, port: Ethernet4,  ifindex: 2, ip: 10.1.2.1/31 }
  - id: leaf2-spine2
    type: fabric
    a: { device: leaf2,  port: Ethernet20, ifindex: 6, ip: 10.1.2.2/31 }
    b: { device: spine2, port: Ethernet4,  ifindex: 2, ip: 10.1.2.3/31 }

  - id: leaf3-spine1
    type: fabric
    a: { device: leaf3,  port: Ethernet16, ifindex: 5, ip: 10.1.3.0/31 }
    b: { device: spine1, port: Ethernet8,  ifindex: 3, ip: 10.1.3.1/31 }
  - id: leaf3-spine2
    type: fabric
    a: { device: leaf3,  port: Ethernet20, ifindex: 6, ip: 10.1.3.2/31 }
    b: { device: spine2, port: Ethernet8,  ifindex: 3, ip: 10.1.3.3/31 }

  - id: leaf4-spine1
    type: fabric
    a: { device: leaf4,  port: Ethernet16, ifindex: 5, ip: 10.1.4.0/31 }
    b: { device: spine1, port: Ethernet12, ifindex: 4, ip: 10.1.4.1/31 }
  - id: leaf4-spine2
    type: fabric
    a: { device: leaf4,  port: Ethernet20, ifindex: 6, ip: 10.1.4.2/31 }
    b: { device: spine2, port: Ethernet12, ifindex: 4, ip: 10.1.4.3/31 }

  # ===== rail 0 -- every node's NIC 0 lands on leaf1 ========================
  - id: gpu01-rail0
    type: rail
    rail: 0
    a: { device: gpu01, port: rail0,      ifindex: 1 }
    b: { device: leaf1, port: Ethernet0,  ifindex: 1 }
  - id: gpu02-rail0
    type: rail
    rail: 0
    a: { device: gpu02, port: rail0,      ifindex: 1 }
    b: { device: leaf1, port: Ethernet4,  ifindex: 2 }
  - id: gpu03-rail0
    type: rail
    rail: 0
    a: { device: gpu03, port: rail0,      ifindex: 1 }
    b: { device: leaf1, port: Ethernet8,  ifindex: 3 }
  - id: gpu04-rail0
    type: rail
    rail: 0
    a: { device: gpu04, port: rail0,      ifindex: 1 }
    b: { device: leaf1, port: Ethernet12, ifindex: 4 }

  # ===== rail 1 -- every node's NIC 1 lands on leaf2 ========================
  - id: gpu01-rail1
    type: rail
    rail: 1
    a: { device: gpu01, port: rail1,      ifindex: 2 }
    b: { device: leaf2, port: Ethernet0,  ifindex: 1 }
  - id: gpu02-rail1
    type: rail
    rail: 1
    a: { device: gpu02, port: rail1,      ifindex: 2 }
    b: { device: leaf2, port: Ethernet4,  ifindex: 2 }
  - id: gpu03-rail1
    type: rail
    rail: 1
    a: { device: gpu03, port: rail1,      ifindex: 2 }
    b: { device: leaf2, port: Ethernet8,  ifindex: 3 }
  - id: gpu04-rail1
    type: rail
    rail: 1
    a: { device: gpu04, port: rail1,      ifindex: 2 }
    b: { device: leaf2, port: Ethernet12, ifindex: 4 }

  # ===== rail 2 -- every node's NIC 2 lands on leaf3 ========================
  - id: gpu01-rail2
    type: rail
    rail: 2
    a: { device: gpu01, port: rail2,      ifindex: 3 }
    b: { device: leaf3, port: Ethernet0,  ifindex: 1 }
  - id: gpu02-rail2
    type: rail
    rail: 2
    a: { device: gpu02, port: rail2,      ifindex: 3 }
    b: { device: leaf3, port: Ethernet4,  ifindex: 2 }
  - id: gpu03-rail2
    type: rail
    rail: 2
    a: { device: gpu03, port: rail2,      ifindex: 3 }
    b: { device: leaf3, port: Ethernet8,  ifindex: 3 }
  - id: gpu04-rail2
    type: rail
    rail: 2
    a: { device: gpu04, port: rail2,      ifindex: 3 }

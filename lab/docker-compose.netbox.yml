# NetBox -- the source of truth of record.
#
# Kept in its own compose file because it is by far the heaviest part of the seed and the
# slowest to start. The YAML in sot/ is what humans author; this is what the pipeline
# reads. `tools/netbox_seed.py` loads one into the other, and `tools/netbox_source.py`
# reads it back out to render golden configs.

name: aidc-lab

networks:
  oob:
    name: aidc-oob
    external: true
  netbox-backend:
    name: aidc-netbox-backend
    driver: bridge

services:
  netbox-db:
    image: postgres:16-alpine
    container_name: netbox-db
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
    volumes:
      - netbox-db:/var/lib/postgresql/data
    networks: [netbox-backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  netbox-redis:
    image: redis:7-alpine
    container_name: netbox-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - netbox-redis:/data
    networks: [netbox-backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  netbox:
    image: netboxcommunity/netbox:v4.1-3.0.2
    container_name: netbox
    depends_on:
      netbox-db: { condition: service_healthy }
      netbox-redis: { condition: service_healthy }
    environment:
      DB_HOST: netbox-db
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox
      REDIS_HOST: netbox-redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_SSL: "false"
      REDIS_CACHE_HOST: netbox-redis
      REDIS_CACHE_PORT: "6379"
      REDIS_CACHE_DATABASE: "1"
      REDIS_CACHE_SSL: "false"
      SECRET_KEY: "aidc-lab-secret-key-not-for-production-use-0123456789abcdef"
      ALLOWED_HOSTS: "*"
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@pod1.lab
      SUPERUSER_PASSWORD: admin
      # Fixed token so the seeder and generator need no interactive login.
      SUPERUSER_API_TOKEN: "0123456789abcdef0123456789abcdef01234567"
    ports:
      - "18000:8080"
    networks:
      netbox-backend:
      oob:
        ipv4_address: 10.10.0.11
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/login/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    restart: unless-stopped

volumes:
  netbox-db:
  netbox-redis:
